<style>
:root{--navy:#04003A;--green:#30D171;--fg:#F3F4FF;--muted:#A9AAD8;--line:#2B2780;--err:#FF8A80;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--navy);color:var(--fg);font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:18px}
.box img{width:220px;max-width:100%;height:auto}
h1{margin:0;font-size:1.6rem;font-weight:800;line-height:1.1;text-transform:uppercase;letter-spacing:-.01em}
h1 em{font-style:italic;font-weight:900;color:var(--green)}
p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.5}
form{display:flex;flex-direction:column;gap:10px}
label{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input[type=password]{font:inherit;font-size:1rem;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:#0C0852;color:var(--fg)}
input[type=password]:focus{outline:2px solid var(--green);outline-offset:1px}
.row{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.row input{accent-color:var(--green);width:16px;height:16px;margin:0}
button{font:inherit;font-weight:800;font-size:.95rem;padding:12px;border-radius:8px;border:0;background:var(--green);color:var(--navy);cursor:pointer}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--err);font-size:.85rem;min-height:1.2em}
</style>
</head>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.salt), iterations:P.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, key, b64(P.data));
  return new TextDecoder().decode(plain);
}
function show(html){
  document.open();
  document.write('<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>' + html + '</body></html>');
  document.close();
}
async function tryPw(pw, remember){
  const html = await unlock(pw);
  if (remember) { try { localStorage.setItem("as-cal-pw", pw); } catch(_){} }
  show(html);
}
(async () => {
  let saved = null; try { saved = localStorage.getItem("as-cal-pw"); } catch(_){}
  if (saved) { try { await tryPw(saved, false); return; } catch(_){ try { localStorage.removeItem("as-cal-pw"); } catch(__){} } }
})();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Abriendo…"; err.textContent = "";
  try { await tryPw(document.getElementById("pw").value, document.getElementById("rem").checked); }
  catch(_) { err.textContent = "Contraseña incorrecta. Revísala e inténtalo de nuevo."; btn.disabled = false; btn.textContent = "Entrar"; }
});
